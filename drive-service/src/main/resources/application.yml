server:
  port: 8082
spring:
  application:
    name: drive-service
  datasource:
    url: jdbc:postgresql://localhost:5432/placementdb?currentSchema=drive
    username: placement
    password: placement123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    schemas: drive
    default-schema: drive
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info


