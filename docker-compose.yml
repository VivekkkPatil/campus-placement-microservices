services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement123
      POSTGRES_DB: placementdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
