server:
  port: 8083
spring:
  application:
    name: application-service
  datasource:
    url: jdbc:postgresql://localhost:5432/placementdb?currentSchema=application
    username: placement
    password: placement123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    schemas: application
    default-schema: application
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info


